name: macOS - Build Hotfix Release

defaults:
  run:
    working-directory: macOS

on:
  workflow_dispatch:
    inputs:
      asana-task-url:
        description: "Asana release task URL"
        required: true
        type: string
      base-branch:
        description: "Base branch (defaults to main, only override for testing)"
        required: false
        type: string
      current-internal-release-branch:
        description: "Current internal release branch (to merge hotfix branch to - hotfix branch is merged to main if this is not provided)"
        required: false
        type: string

concurrency:
  group: 'macos-release' # prevent running this and regular release workflows at the same time
  cancel-in-progress: false

jobs:

  assert_release_branch:

    name: Assert Hotfix Branch

    runs-on: macos-26
    timeout-minutes: 10

    steps:

      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Assert hotfix release branch
        run: |
          case "${{ github.ref }}" in
            refs/heads/hotfix/*) ;;
            *) echo "👎 Not a hotfix release branch"; exit 1 ;;
          esac

      - name: Setup Ruby and dependencies
        uses: ./.github/actions/setup-ruby
        with:
          working-directory: macOS
          cache-key-prefix: macos-ruby

  run_tests:

    name: Run Tests

    needs: assert_release_branch
    uses: ./.github/workflows/macos_pr_checks.yml
    secrets: inherit

  increment_build_number:

    name: Increment Build Number

    needs: [assert_release_branch, run_tests]
    runs-on: macos-26
    timeout-minutes: 10

    outputs:
      commit_sha: ${{ steps.bump-build-number.outputs.commit_sha }}

    steps:

      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          submodules: recursive

      - name: Setup Ruby and dependencies
        uses: ./.github/actions/setup-ruby
        with:
          working-directory: macOS
          cache-key-prefix: macos-ruby

      - name: Increment build number
        id: bump-build-number
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER }}
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          bundle exec fastlane run bump_build_number platform:macos

  prepare_release:
    name: Prepare Release
    needs: [run_tests, increment_build_number]
    uses: ./.github/workflows/macos_release.yml
    with:
      asana-task-url: ${{ github.event.inputs.asana-task-url }}
      commit-sha: ${{ needs.increment_build_number.outputs.commit_sha }}
      destination: appstore
    secrets: inherit

  tag_and_merge:
    name: Tag and Merge Branch
    needs: [ prepare_release, increment_build_number ]
    uses: ./.github/workflows/macos_tag_release.yml
    with:
      asana-task-url: ${{ github.event.inputs.asana-task-url }}
      branch: ${{ github.ref_name }}
      base-branch: ${{ github.event.inputs.current-internal-release-branch || 'main' }}
      commit-sha: ${{ needs.increment_build_number.outputs.commit_sha }}
      prerelease: true # Pre-release for now, and the actual release will be done as part of publish_dmg_release that's called later
    secrets: inherit

  report_failure:
    name: Report Failure
    needs: [ assert_release_branch, run_tests, increment_build_number, prepare_release, tag_and_merge ]
    if: always() && (needs.run_tests.result == 'failure' || needs.increment_build_number.result == 'failure' || needs.prepare_release.result == 'failure' || needs.tag_and_merge.result == 'failure')
    uses: ./.github/workflows/report_failed_release_workflow.yml
    with:
      asana-task-id: ${{ needs.assert_release_branch.outputs.asana_task_id }}
      branch: ${{ github.ref_name }}
      commit-sha: ${{ needs.increment_build_number.outputs.commit_sha }}
      platform: macos
      workflow-name: "build hotfix release"
    secrets: inherit
